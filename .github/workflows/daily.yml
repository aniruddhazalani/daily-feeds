name: Daily feeds

on:
  schedule:
    # GitHub delays (and sometimes drops) scheduled runs, worst at the top of the hour,
    # so run early and off the hour, with a backup that only builds if the first didn't.
    - cron: "17 23 * * *"   # 04:47 IST — main run
    - cron: "23 0 * * *"    # 05:53 IST — backup, skipped if today's page already exists
  workflow_dispatch: {}

permissions:
  contents: write   # commit data/ (archive, seen list, discovered sources)
  pages: write
  id-token: write

concurrency:
  group: daily-feeds
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/days
      - id: guard
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          if [ "${{ github.event.schedule }}" = "23 0 * * *" ] && [ -f "data/days/$today.json" ]; then
            echo "Today's page ($today) is already built; backup run not needed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover tests

      - name: Build feeds
        run: python -m feeds build

      - name: Commit data
        run: |
          git config user.name "daily-feeds-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: $(TZ=Asia/Kolkata date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
