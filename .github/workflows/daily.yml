name: Daily feeds

on:
  schedule:
    # GitHub's scheduler is best-effort, and on this repo runs start ~2.5h late (the 03:37
    # slot ran at 05:59 on Oct 24) or get dropped. News is fetched when the run actually
    # starts, so scheduling early doesn't make it staler. Seven slots, 01:07–04:07 IST;
    # once a page has been built after 03:00 IST, later slots exit in seconds.
    - cron: "37 19 * * *"   # 01:07 IST
    - cron: "7 20 * * *"    # 01:37 IST
    - cron: "37 20 * * *"   # 02:07 IST
    - cron: "7 21 * * *"    # 02:37 IST
    - cron: "37 21 * * *"   # 03:07 IST
    - cron: "7 22 * * *"    # 03:37 IST
    - cron: "37 22 * * *"   # 04:07 IST
  workflow_dispatch: {}

permissions:
  contents: write   # commit data/ (archive, seen list, discovered sources)
  pages: write
  id-token: write

concurrency:
  group: daily-feeds
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/days
      - id: guard
        # Scheduled runs skip if this morning's page (built after 03:00 IST) already exists.
        # Manual runs always build.
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          from datetime import datetime, timedelta, timezone
          ist = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(ist)
          snap = pathlib.Path(f"data/days/{now.date()}.json")
          built_this_morning = False
          if snap.exists():
              built = datetime.fromisoformat(json.loads(snap.read_text())["generated_at"]).astimezone(ist)
              built_this_morning = built >= now.replace(hour=3, minute=0, second=0, microsecond=0)
          skip = os.environ["EVENT"] == "schedule" and built_this_morning
          print("run=" + ("false" if skip else "true"))
          PY
        env:
          EVENT: ${{ github.event_name }}

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover tests

      - name: Build feeds
        run: python -m feeds build

      - name: Commit data
        run: |
          git config user.name "daily-feeds-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: $(TZ=Asia/Kolkata date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
