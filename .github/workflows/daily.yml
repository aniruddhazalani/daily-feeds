name: Daily feeds

on:
  schedule:
    # GitHub's scheduler is best-effort, and on this repo runs start ~2.5h late (the 03:37
    # slot ran at 05:59 on Oct 24) or get dropped. News is fetched when the run actually
    # starts, so scheduling early doesn't make it staler. Seven slots, 01:07–04:07 IST;
    # once a page has been built after 03:00 IST, later slots exit in seconds.
    - cron: "37 19 * * *"   # 01:07 IST
    - cron: "7 20 * * *"    # 01:37 IST
    - cron: "37 20 * * *"   # 02:07 IST
    - cron: "7 21 * * *"    # 02:37 IST
    - cron: "37 21 * * *"   # 03:07 IST
    - cron: "7 22 * * *"    # 03:37 IST
    - cron: "37 22 * * *"   # 04:07 IST
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if the last build was less than an hour ago"
        type: boolean
        default: false

permissions:
  contents: write   # commit data/ (archive, seen list, discovered sources)
  pages: write
  id-token: write

concurrency:
  group: daily-feeds
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/days
      - id: guard
        # Scheduled runs: skip once this morning's page (built after 03:00 IST) exists.
        # Manual runs (the page's Refresh button): skip if the last build was less than
        # refresh.min_minutes ago (feeds.yaml), unless started with force.
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          from datetime import datetime, timedelta, timezone
          ist = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(ist)
          snaps = sorted(pathlib.Path("data/days").glob("*.json"))
          last = (datetime.fromisoformat(json.loads(snaps[-1].read_text())["generated_at"]).astimezone(ist)
                  if snaps else None)
          m = re.search(r"refresh:.*min_minutes:\s*(\d+)", pathlib.Path("feeds.yaml").read_text())
          min_minutes = int(m.group(1)) if m else 60
          if os.environ["EVENT"] == "schedule":
              skip = bool(last and last.date() == now.date() and last.hour >= 3)
              why = "this morning's page is already built"
          else:
              skip = (os.environ["FORCE"] != "true" and last is not None
                      and now - last < timedelta(minutes=min_minutes))
              why = f"last build was at {last:%H:%M} IST; refreshes are limited to one per {min_minutes} min" if last else ""
          if skip:
              print(f"::notice::Skipping build: {why}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("run=" + ("false" if skip else "true") + "\n")
          PY
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover tests

      - name: Build feeds
        run: python -m feeds build

      - name: Commit data
        run: |
          git config user.name "daily-feeds-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: $(TZ=Asia/Kolkata date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
