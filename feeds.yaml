                   coup: 3, missile: 2, strike: 1, invasion: 3, diplomacy: 2, diplomatic: 2, treaty: 2, Ukraine: 2,
                   Russia: 2, China: 2, Taiwan: 2, Israel: 2, Gaza: 2, Iran: 2, "North Korea": 2, "South China Sea": 3,
                   "Middle East": 2, EU: 1, G7: 2, G20: 2, BRICS: 2, military: 2, troops: 2, "foreign minister": 2,
