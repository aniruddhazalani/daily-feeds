feeds:
  politics:
    title: Politics
    balance: true     # keep left- and right-leaning outlets even in every section
    analysis_label: In depth & analysis
    sections:
      world:
        title: World & geopolitics
        sources: [bbc_world, aljazeera, guardian_world, gn_ap_world, gn_reuters_world, the_diplomat, lowy,
                  warontherocks, foreign_affairs, foreign_policy, csis, carnegie, brookings, chatham_house,
                  ecfr, lawfare, isw, chinatalk, phillips_obrien, geopolitical_futures,
                  fox_world, wsj_world, telegraph_world, spectator, national_review, the_dispatch, free_press, unherd,
                  national_interest, fdd, hudson, heritage, aei, hoover, the_hill, axios, wion_world,
                  atlantic_intl, economist_intl, economist_briefing, reuters_investigates, ft_bigread,
                  bloomberg_bigtake, city_journal]
