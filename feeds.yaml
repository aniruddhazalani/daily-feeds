# Daily Feeds configuration
#
# Feeds and sections are defined ONLY here. Sources listed here are "trusted".
# The app may add "discovered" sources on its own (data/discovered_sources.yaml);
# promote one by copying it here, or mute it by adding its domain to ignore_sources.
#
# Source fields:
#   type:    rss | gnews | arxiv | hf_papers
#   url:     feed URL (rss), or API URL (hf_papers)
#   query:   Google News query (gnews) or arXiv search_query (arxiv)
#   kind:    official | news | blog | paper | search      (sets time window, badge, default weight)
#   weight:  optional override (defaults: official 3, news 2, blog 2, paper 2, search 1)
#   topical: true if every post is on-topic for the sections that list it (+3 score)
#   paywall: true to show a lock next to its headlines
#   fallback: Google News query used when the feed is blocked/empty (automatic for *.substack.com)
#
# Section fields:
#   include:     {term: weight}  terms matched case-insensitively on word boundaries
#   exclude:     [terms]          any match drops the item from this section
#   require_any: [terms]          item must match at least one of these (optional)
#   min_score / max_items / max_analysis / max_papers: optional overrides
#   window_hours: keep stories this long for slow-moving sections (e.g. 168 = 7 days);
#                 the already-shown list stops repeats

settings:
  site_title: Daily Feeds
  timezone: Asia/Kolkata
  windows_hours: { news: 36, search: 36, paper: 96, blog: 168, official: 168, discovered: 72 }
  default_min_score: 3
  default_max_items: 12
  default_max_analysis: 6
  default_max_papers: 8
  show_first: 5
  # Titles matching any of these are dropped everywhere (job ads, archive pages, empty titles).
  junk_titles:
    - '^\s*[-–|]'
    - '\bArchives\b'
    - '^[^:]{0,80}\b(Engineer|Scientist|Researcher|Designer|Manager|Intern|Recruiter|Director|Specialist|Staff|Lead|Head|Partner|Associate|Analyst|Executive)\b[^:]{0,60}\bat [A-Z]'
    - '\((R|REQ|JR)\d{3,}\)'
    - '^(Jobs|Careers|Home|Page \d+)\b'
    - '\bPage \d+ of \d+'
    - '- (Full Commentary|Live Stream|Live Score|Match News|Scorecard|Live Cricket Score)\s*$'
    - '\bOdds\b.*\bBookmakers\b'
    - '\bPredictions?,? Odds\b|\bBest Bets\b|\bBetting Tips\b'
    - '^MEA \|'                    # MEA site navigation pages
    - '%[0-9A-Fa-f]{2}%[0-9A-Fa-f]{2}'   # URL-encoded titles (feeds that break on non-Latin text)
  dedupe_threshold: 88
  # Group articles about the same story (even with different headlines) under one entry.
  # similarity: 0–1, higher = stricter. 0.4 was tuned on real days: ~95% of groups correct.
  story_grouping: { enabled: true, similarity: 0.4, min_shared: 2, max_hours_apart: 48 }
  # Outlets trusted to *report* news even when they reach us through a Google News search.
  # Feeds with `vetted_only: true` keep a search result only if its outlet is vetted
  # (this list, or any trusted source in this file) or a vetted outlet covers the same story.
  vetted_domains: [reuters.com, apnews.com, bloomberg.com, ft.com, wsj.com, nytimes.com, washingtonpost.com,
                   economist.com, cnbc.com, axios.com, theverge.com, arstechnica.com, technologyreview.com, wired.com,
                   theinformation.com, techcrunch.com, venturebeat.com, semafor.com, fortune.com, businessinsider.com,
                   forbes.com, geekwire.com, siliconangle.com, theregister.com, zdnet.com, engadget.com, tomshardware.com,
                   nature.com, science.org, ieee.org, spectrum.ieee.org, bbc.co.uk, bbc.com, theguardian.com,
                   economictimes.indiatimes.com, livemint.com, business-standard.com, moneycontrol.com, inc42.com,
                   yourstory.com, entrackr.com, the-ken.com, restofworld.org, sifted.eu, techinasia.com, scmp.com,
                   nikkei.com, asia.nikkei.com, digitimes.com, adexchanger.com, digiday.com, therobotreport.com]
  # Continuing storylines: a headline that continues a story shown in the last few days moves
  # to a compact "Developing" list, unless its coverage jumped (2x, or +5 outlets).
  developing: { enabled: true, lookback_days: 3, similarity: 0.4, min_shared: 3 }

  # Impact rating by Claude (Claude Code headless, using your Claude subscription token in
  # GitHub Actions: secret CLAUDE_CODE_OAUTH_TOKEN). Stories rated below hide_below are hidden;
  # the rest are ordered by impact first. Without a working login the page uses rules only.
  impact:
    enabled: true
    feeds: [politics, finance, ai]
    model: opus
    fallback_models: [sonnet]   # tried if the plan refuses the main model
    effort: low
    hide_below: 3
    weight: 3.0            # score points per impact level above/below 3
    batch_size: 40
    parallel: 3
    cache_days: 4
    timeout_seconds: 300
    per_section: { news: 30, analysis: 12, papers: 12 }   # how deep to rate; unrated stories aren't shown
    profile: |
      One reader, based in India, who works in AI (focused on LLMs and recommender systems) and wants to
      stay well informed without wasting time. They care about:
      - World politics and geopolitics: wars, diplomacy, alliances, elections that shift global power.
      - US policy that affects immigration, especially H-1B, green cards, OPT and Indian workers.
      - India in depth: decisions that shape the country's future: international meetings, summits,
        bilateral deals, defence and trade agreements, Cabinet decisions, major legislation, constitutional
        cases, high-level national meetings and reforms. Party rhetoric and election punditry are low value.
      - Macro finance: central banks and interest rates, government fiscal policy, oil supply and the
        effect of wars on oil (financially), de-dollarization and BRICS payment rails, US debt servicing,
        Project 2025, UN Agenda 2030.
      - AI: which startups are hot and who raised money, what VCs think, AI revenue and business models,
        frontier lab research and releases, LLMs, recommender systems, AI in ads and social media,
        robotics, and major conferences (NeurIPS, ICML, ICLR, CVPR, ACL, KDD, RecSys, SIGIR).
      They prefer substance and analysis over hype, and primary sources over rewrites.

  # Top stories tab: the most widely covered stories across all feeds.
  top_stories: { count: 15, min_outlets: 3 }
  # Refresh button on the page. The workflow also refuses manual builds within min_minutes of the last one.
  refresh: { repo: aniruddhazalani/daily-feeds, workflow: daily.yml, min_minutes: 60 }
  archive_days: 60
  seen_days: 14
  discovery:
    enabled: true
    window_days: 14
    search_hits: 10       # qualifying items from Google News results…
    search_days: 5        # …seen on at least this many different days
    citations: 3          # distinct trusted sources linking to the domain
    max_new_per_day: 5
    max_active: 40
    retire_days: 30
    new_badge_days: 7

# Words that mark political point-scoring rather than substance. Sections with
# `penalize: *rhetoric` subtract these weights (headline x1, snippet x0.5).
rhetoric_penalty: &rhetoric
  { slams: 3, slam: 3, jibe: 3, jibes: 3, "takes dig": 3, "takes a dig": 3, "hits out": 3, "hits back": 3,
    "war of words": 4, "lashes out": 3, mocks: 3, taunts: 3, "takes aim": 2, effigy: 4, remark: 2, remarks: 2,
    slugfest: 4, "round 2": 2, counters: 2, fumes: 3, "calls out": 2, defamatory: 2, FIR: 2, booked: 2,
    roadshow: 2, "public impeachment": 2 }

ignore_sources:          # muted 2026-10-24: noise picked up by discovery
  - federalregister.gov  # routine agency notices
  - tovima.com           # Greek-language news
  - cibercuba.com
  - en.cibercuba.com
  - manilatimes.net
  - footballtransfertavern.com  # muted 2026-10-25: fan transfer-rumour blog
  - en.wowtale.net             # muted 2026-10-25: startup press-release reposts
  # muted 2026-10-31: stock-tip, SEO and press-release-repost sites that crowded the AI feed
  - simplywall.st
  - tipranks.com
  - kucoin.com
  - analyticsinsight.net
  - theaiinsider.tech
  - xenospectrum.com
  - ad-hoc-news.de
  - equiti.com
  - pluang.com
  - menafn.com
  - kalkinemedia.com
  - aimagazine.com
  - techbullion.com
  - openpr.com
  - einpresswire.com
  - opentools.ai

# Political lean of outlets, by domain (subdomains included). Used to label headlines and,
# in feeds with `balance: true`, to keep left and right in balance. Ratings follow
# AllSides / Ad Fontes where they exist and are judgment calls otherwise — edit freely.
# Outlets not listed are "unrated" and don't count either way.
leans:
  left: [theguardian.com, aljazeera.com, aljazeera.net, npr.org, nytimes.com, washingtonpost.com, cnn.com, msnbc.com,
         nbcnews.com, cbsnews.com, abcnews.go.com, latimes.com, politico.com, theatlantic.com, vox.com, huffpost.com,
         motherjones.com, newyorker.com, independent.co.uk, democracynow.org, jacobin.com, opendemocracy.net,
         foreignpolicy.com, brookings.edu, lawfaremedia.org, migrationpolicy.org, americanimmigrationcouncil.org,
         immigrationimpact.com, thehindu.com, scroll.in, thewire.in, ndtv.com, thenewsminute.com, thequint.com,
         newslaundry.com, epw.in, deccanherald.com, telegraphindia.com, propublica.org]
  center: [reuters.com, apnews.com, bbc.co.uk, bbc.com, bbci.co.uk, thehill.com, axios.com, bloomberg.com, ft.com,
           economist.com, wsj.com, cnbc.com, newsnationnow.com, csis.org, chathamhouse.org, cfr.org, foreignaffairs.com,
           warontherocks.com, ecfr.eu, thediplomat.com, lowyinstitute.org, carnegieendowment.org, understandingwar.org,
           geopoliticalfutures.com, chinatalk.media, indianexpress.com, theprint.in, hindustantimes.com, livemint.com,
           indiatimes.com, indiatoday.in, business-standard.com, moneycontrol.com, orfonline.org, pib.gov.in,
           uscis.gov, dhs.gov, state.gov, fragomen.com, murthy.com, boundless.com, jdsupra.com, mea.gov.in,
           pmindia.gov.in, niti.gov.in, prsindia.org, gatewayhouse.in, idsa.in, takshashila.org.in]
  right: [foxnews.com, foxbusiness.com, nypost.com, washingtonexaminer.com, washingtontimes.com, nationalreview.com,
          thedispatch.com, thefp.com, dailywire.com, dailycaller.com, breitbart.com, newsmax.com, freebeacon.com,
          theamericanconservative.com, city-journal.org, realclearpolitics.com, realclearworld.com, telegraph.co.uk,
          spectator.co.uk, dailymail.co.uk, thetimes.co.uk, thetimes.com, unherd.com, nationalinterest.org, fdd.org,
          hudson.org, heritage.org, aei.org, hoover.org, cato.org, cis.org, fairus.org, swarajyamag.com, opindia.com,
          republicworld.com, news18.com, firstpost.com, dailypioneer.com, wionews.com, zeenews.india.com, organiser.org,
          openthemagazine.com]

